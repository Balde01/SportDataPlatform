plugins {
   id 'java'
   id 'com.diffplug.spotless' version '8.10.3'
}

group = 'com.sportdataauth'
version = '0.1.0'

repositories {
   mavenCentral()
}

dependencies {

   // ===== SECURITY =====
   implementation "org.mindrot:jbcrypt:0.4"

   // ===== TESTING =====
   testImplementation "org.junit.jupiter:junit-jupiter:5.10.0"
   testRuntimeOnly "org.junit.platform:junit-platform-launcher"

   // ==== DATABASE =====
   implementation "org.postgresql:postgresql:42.7.4"
   // ==== FLYWAY =====
   implementation "org.flywaydb:flyway-core:10.17.0"
}

java {
   toolchain {
       languageVersion = JavaLanguageVersion.of(21)
   }
}

spotless {
    java {
        eclipse().configFile(
            rootProject.file("config/java-formatter.xml")
        )

        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('test') {
   useJUnitPlatform()
}

// PostgreSQL integration tests are kept separate from unit tests.
// They require a running database and DB_* environment variables.
sourceSets {
   integrationTest {
       java.srcDir 'src/integrationTest/java'
       resources.srcDir 'src/integrationTest/resources'

       compileClasspath += sourceSets.main.output
       runtimeClasspath += sourceSets.main.output
   }
}

// Reuse the same JUnit dependencies as the regular test source set.
configurations {
   integrationTestImplementation.extendsFrom testImplementation
   integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('integrationTest', Test) {
   description = 'Runs the integration tests.'
   group = 'verification'

   testClassesDirs = sourceSets.integrationTest.output.classesDirs
   classpath = sourceSets.integrationTest.runtimeClasspath

   useJUnitPlatform()
   shouldRunAfter test
}

// integrationTest is intentionally not attached to `check` yet.
// CI must provide PostgreSQL before integration tests can become part of `build`.